<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Italia – Explore with all senses. Desková hra pro 2–6 hráčů: pochutiny, vína a pamětihodnosti Itálie.">
<meta name="theme-color" content="#14203b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Italia">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Italia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Vizuál převzatý z Immigrants: tmavě modrý horní pás s hráči, papírový panel, razítková červená. Jeden pevný (světlý) vzhled. */
[hidden]{display:none!important}
:root{
  --ink:#14203b; --ink-2:#22345e; --ink-3:#3a4d7a;
  --paper:#f1e9d6; --paper-2:#e4d8bd; --paper-3:#d3c39f;
  --stamp:#c62420; --gold:#b88a2c; --text:#1a2036; --muted:#5f6070; --ok:#2c7a3f;
  --sea:#b7dde6; --land:#f7f4ec; --border:#9aa6a0; --nbFill:#f1f2f1; --nbLine:#a7aeab; --nbText:#a3aaa7;
  --track:#fbf6e9; --trackEdge:#5a5446; --seaRoute:#2e7ab8; --air:#7a4fb5; --rail:#b5121b;
  --sym:#2e3230; --whiteStroke:#2b2f2d;
  --f-display:'Alfa Slab One','Rockwell','Georgia',serif;
  --f-ui:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* horní pás */
#topbar{flex:none;display:flex;align-items:stretch;gap:6px;background:var(--ink);border-bottom:3px solid var(--stamp);
  padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
#chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:6px;background:var(--ink-2);color:#e9e3d2;border:1px solid transparent;font-family:var(--f-ui);line-height:1.05;position:relative}
.chip.cur{background:var(--paper);color:var(--text);border-color:var(--gold)}
.chip.cur::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:4px;border-radius:2px;background:var(--pc)}
.chip.dead{opacity:.4;text-decoration:line-through}
.chip .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.chip .nm{font-weight:600;font-size:14px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .cs{font-size:13px;opacity:.9}
.chip.debt .cs{color:#ff8a80;font-weight:700;opacity:1}
.chip.cur.debt .cs{color:var(--stamp)}
.cnt{display:flex;gap:5px;font-size:12.5px;font-weight:600}
.cnt span{display:inline-flex;align-items:center;gap:1px}
.cnt span.z{opacity:.4}
.cnt svg{width:14px;height:14px;flex:none}
.cnt sup.mult{font-size:10px;color:#ffb3a8;font-weight:700;margin-left:1px}
.chip.cur .cnt sup.mult{color:var(--stamp)}
.chip:not(.cur) .cnt svg{background:#f1e9d6;border-radius:3px}
.iconbtn{flex:none;width:40px;border-radius:6px;border:0;background:var(--ink-2);color:#efe8d6;display:grid;place-items:center;font-size:20px}
.pawnic{flex:none;display:block}

/* hlavní plocha */
#mapwrap{position:relative;flex:1;overflow:hidden;background:var(--sea);touch-action:none;min-height:0}
svg#map{width:100%;height:100%;display:block;user-select:none}
.mapctl{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:34px;height:34px;padding:0;border-radius:8px;border:1px solid rgba(20,32,59,.25);background:rgba(241,233,214,.94);color:var(--ink);font-size:18px;font-weight:700;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.18);display:grid;place-items:center}
.mapctl button svg{width:17px;height:17px}
#steps{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:66px;background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:8px;font-family:var(--f-ui);font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.25);border-top:4px solid var(--pc,var(--ink))}
#steps b{font-size:22px;color:#ffd66b;margin-right:4px}

/* herní panel: plovoucí okno vpravo dole (na telefonu přes šířku obrazovky), dá se sbalit a rozbalit – jako Immigrants */
#panel{position:absolute;z-index:5;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));
  background:var(--paper);border:3px solid var(--ink);border-radius:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;max-height:46vh;box-shadow:0 8px 24px rgba(0,0,0,.35);
  padding:10px 12px 12px}
#panel:empty{display:none}
/* nabídka koupě: vyšší okno, aby byla vidět karta i tlačítka Koupit / Nekupovat */
#panel.buy{max-height:calc(100% - 90px)}
@media (max-width:560px){#panel.buy .cardpic img,#panel.buy .cardpic .tfallback{width:min(44%,170px)}#panel.buy .kv{font-size:15px}}
.ptoggle{display:grid;position:absolute;top:6px;right:6px;width:34px;height:34px;border:0;border-radius:8px;background:var(--paper-2);color:var(--ink);place-items:center;font-size:20px;font-weight:700;line-height:1}
#panel .ph{padding-right:40px}
#panel.mini{left:auto;max-width:calc(100% - 20px);padding-block:6px}
#panel.mini>:not(.ph):not(.ptoggle){display:none!important}
#panel.mini .ph .sub{display:none}
@media (min-width:900px),(orientation:landscape) and (max-height:600px){
  #panel{left:auto;width:380px;max-width:46vw;max-height:70vh}
  #panel.mini{max-width:60vw}
}
@media (orientation:landscape) and (max-height:600px){
  #topbar{padding-block:3px}.chip{padding:2px 8px 2px 4px}.chip .pawnic{height:24px;width:17px}
  #panel{width:320px;max-height:calc(100% - 78px);gap:6px;padding-block:6px 8px}
  #panel .ph .pawnic{height:30px;width:21px}
  .ph h2{font-size:17px}.ph .sub{font-size:13px}
  .wallet .amt{font-size:20px}.bills{height:28px}.bills img{height:26px}
  .dicesel b{font-size:15px}.dicesel span{font-size:11.5px}
  .btn.big{min-height:42px;font-size:18px}.btn{min-height:36px;padding:6px 10px;font-size:15px}
  .die{width:36px;height:36px;padding:5px}
  .mapctl{flex-direction:row;top:auto;right:auto;bottom:10px;left:max(10px,env(safe-area-inset-left,0px))}
  .mapctl button{width:32px;height:32px}
}
.ph{display:flex;align-items:center;gap:10px;border-left:6px solid var(--pc,var(--ink));padding-left:10px}
.ph h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;letter-spacing:.3px;color:var(--ink);line-height:1.1;text-wrap:balance}
.ph .sub{font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.btn{border:0;border-radius:8px;padding:10px 14px;font-family:var(--f-ui);font-size:17px;font-weight:600;letter-spacing:.3px;background:var(--ink);color:var(--paper);min-height:46px}
.btn.red{background:var(--stamp);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.soft{background:var(--paper-2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:21px;min-height:56px}
.btn small{display:block;font-size:12.5px;font-weight:500;opacity:.85;letter-spacing:0}
.note{font-size:13.5px;color:var(--muted);line-height:1.4;margin:0}
.err{color:var(--stamp);font-size:13.5px;font-family:var(--f-ui);margin:0}
.sec{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:1.2px;font-size:13px;color:var(--muted);margin:4px 0 -4px}
.again{background:#ffd66b;color:var(--ink);border-radius:8px;padding:6px 10px;font-family:var(--f-ui);font-weight:700;font-size:16px}
.wallet{display:flex;align-items:center;gap:12px}
.wallet .amt{font-family:var(--f-display);font-size:26px;color:var(--ink)}
.bills{position:relative;height:40px;flex:1;min-width:0}
.bills img{position:absolute;top:0;height:38px;width:auto;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.dice{display:flex;gap:8px;justify-content:center;align-items:center}
.die{width:46px;height:46px;border-radius:9px;background:#fff;border:2px solid var(--ink);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;box-shadow:0 2px 0 var(--ink)}
.die i{width:8px;height:8px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.roll{animation:shake .5s ease-in-out}
@keyframes shake{20%{transform:rotate(-14deg) translateY(-4px)}50%{transform:rotate(12deg)}80%{transform:rotate(-5deg)}}
.optlist{display:flex;flex-direction:column;gap:6px}
.optlist button{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--paper-3);background:#fbf7ec;border-radius:8px;padding:8px 10px;font-family:var(--f-ui);font-size:16px}
.optlist button .k{width:26px;height:26px;border-radius:50%;background:#ffd66b;border:2px solid #c08a00;display:grid;place-items:center;font-weight:700;flex:none}
.optlist button .cost{margin-left:auto;color:var(--stamp);font-weight:700;white-space:nowrap}
.optlist button .cost.free{color:var(--ok)}
.thinking{display:flex;align-items:center;gap:10px;font-family:var(--f-ui);font-size:17px}
.spinner{width:22px;height:22px;border:3px solid var(--paper-3);border-top-color:var(--stamp);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* tabulka majetku */
.otab{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:15px}
.otab th{font-weight:600;color:var(--muted);padding:2px 3px;text-align:center}
.otab th svg{width:16px;height:16px;vertical-align:middle}
.otab td{padding:4px 3px;text-align:center;border-top:1px solid var(--paper-3);font-variant-numeric:tabular-nums}
.otab td:first-child{text-align:left;white-space:nowrap}
.otab td:last-child,.otab th:last-child{text-align:right}
.otab tr.cur td{background:#fbf3dc}
.otab tr.dead td{opacity:.4;text-decoration:line-through}
.otab sup.mult{font-size:11px;color:var(--stamp);font-weight:700;margin-left:1px}
.otab .z{color:var(--paper-3)}
.loglist{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.loglist div:first-child{color:var(--text)}
/* karta políčka */
.tcard{border-radius:10px;overflow:hidden;border:2px solid var(--ink);background:#fbf7ec}
.tcard .hd{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff;font-family:var(--f-ui);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tcard .hd img{width:42px;height:28px;border:2px solid #fff}
.tcard .nm{padding:8px 12px;font-family:var(--f-display);font-size:19px;color:var(--ink)}
.tcard .nm small{display:block;font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.tcard dl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin:0;padding:8px 12px;color:#fff;font-family:var(--f-ui);font-size:16px}
.tcard dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
/* listy */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88%;background:var(--paper);border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:2px solid var(--paper-3)}
.sheet header h3{margin:0;flex:1;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink)}
.sheet .body{overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet .close{border:0;background:var(--paper-2);border-radius:50%;width:36px;height:36px;font-size:20px}
.item{display:flex;flex-direction:column;gap:4px;background:#fbf7ec;border:1px solid var(--paper-3);border-radius:10px;padding:10px}
.item b{font-family:var(--f-ui);font-size:17px;color:var(--ink)}
.item .tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{display:inline-block;font-family:var(--f-ui);font-size:13px;padding:1px 7px;border-radius:10px;background:var(--paper-2);color:var(--ink)}
.tag.red{background:var(--stamp);color:#fff}
.item .acts button{border:0;border-radius:6px;padding:6px 10px;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:14.5px;font-weight:600}
.item .acts button:disabled{opacity:.4}
.item .btn{min-height:40px}
.rules ul{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px}
.rules li{font-size:14.5px;line-height:1.45}
/* toasty a letící bankovky */
#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:rgba(20,32,59,.94);color:var(--paper);padding:8px 12px;border-radius:8px;font-family:var(--f-ui);font-size:15.5px;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:tin .2s ease-out;max-width:100%}
.toast.minus{border-left:5px solid var(--stamp)}
.toast.plus{border-left:5px solid #5cc57a}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.flybill{position:fixed;left:0;top:0;height:30px;width:auto;z-index:70;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.4);border-radius:2px}
#lastroll{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:9px;background:var(--paper);border:2px solid var(--ink);border-top:5px solid var(--pc,var(--ink));box-shadow:0 4px 12px rgba(0,0,0,.28);pointer-events:none}
#lastroll .die{width:30px;height:30px;border-radius:6px;padding:4px;border-width:1.5px;box-shadow:0 1px 0 var(--ink)}
#lastroll .die i{width:5px;height:5px}
#lastroll .sum{font-family:var(--f-ui);font-weight:700;color:var(--ink);font-size:19px;margin-left:2px}
#lastroll .who{font-family:var(--f-ui);font-size:14px;color:var(--muted);margin-right:2px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dicesel{display:flex;gap:6px}
.dicesel button{flex:1;border:2px solid var(--paper-3);background:var(--paper);border-radius:8px;padding:5px 2px;font-family:var(--f-ui);line-height:1.1;color:var(--ink)}
.dicesel button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.dicesel button:disabled{opacity:.4;cursor:not-allowed}
.dicesel b{font-size:17px;display:block}
.dicesel span{font-size:12.5px;opacity:.85}
.cardpic{display:flex;gap:12px;align-items:flex-start}
.cardpic img{width:min(46%,190px);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3);flex:none}
.cardmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cardmeta>b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--ink);line-height:1.15}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:4px 0 0;font-family:var(--f-ui);font-size:16px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.sheet .cardpic img{width:min(52%,260px)}
.cardpic .tfallback{width:min(46%,190px);flex:none}
img.spec{width:100%;max-width:360px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.chiplist{display:flex;flex-wrap:wrap;gap:6px}
.tilebtn{border:1px solid var(--paper-3);background:#fbf7ec;border-radius:14px;padding:3px 10px;font-family:var(--f-ui);font-size:14.5px;color:var(--ink)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.tgrid{grid-template-columns:1fr}}
.tside{display:flex;flex-direction:column;gap:5px;min-width:0}
.tpick{display:flex;align-items:center;gap:7px;text-align:left;border:2px solid var(--paper-3);background:#fbf7ec;border-radius:8px;padding:5px 8px;font-family:var(--f-ui);font-size:15px;color:var(--ink)}
.tpick svg{width:18px;height:18px;flex:none}
.tpick .r{margin-left:auto;color:var(--muted);white-space:nowrap}
.tpick.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.tpick.on .r{color:var(--paper-2)}
.tpick.on svg{background:#f1e9d6;border-radius:3px}
.codebox{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px;border:2px dashed var(--paper-3);border-radius:12px;background:#fffaf0}
.codebox small{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-ui)}
.codebox b{font:400 42px/1 var(--f-display);letter-spacing:.18em;color:var(--ink)}
.lobbylist{display:flex;flex-direction:column;gap:6px}
.lobbyrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#fffaf0;border:1px solid var(--paper-3)}
.lobbyrow b{flex:1;font-size:16px;font-family:var(--f-ui)}
.lobbyrow.free{opacity:.7;border-style:dashed}
.codeinp{border:2px solid var(--paper-3);border-radius:8px;padding:10px;font:700 24px var(--f-body);letter-spacing:.2em;text-transform:uppercase;text-align:center;background:#fffdf7;color:var(--text)}
.codeinp.name{font:16px var(--f-body);letter-spacing:0;text-transform:none;text-align:left}
select{border:2px solid var(--paper-3);border-radius:8px;padding:9px;font:16px var(--f-body);background:#fffdf7;color:var(--text)}
/* úvodní obrazovka */
#setup{position:fixed;inset:0;overflow-y:auto;background:var(--ink);z-index:40;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{max-width:560px;margin:0 auto 14px;text-align:center;color:var(--paper)}
.hero h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:52px;letter-spacing:2px;line-height:1}
.hero h1 span{display:inline-block;width:14px;height:40px;margin:0 1px;vertical-align:-2px}
.hero p{margin:6px 0 0;font-family:var(--f-ui);font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:#cdbf9c}
.setup-card{max-width:560px;margin:0 auto;background:var(--paper);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.prow{display:flex;align-items:center;gap:8px}
.prow input{flex:1;min-width:0;border:2px solid var(--paper-3);border-radius:8px;padding:9px 10px;font:16px var(--f-body);background:#fffdf7;color:var(--text)}
.seg{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:8px 10px;font-family:var(--f-ui);font-size:15px;font-weight:600;color:var(--ink)}
.levelseg{display:flex;width:100%}.levelseg button{flex:1;padding:10px 6px;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rm{border:0;background:transparent;font-size:22px;color:var(--muted);width:32px;flex:none}
label.fl{display:flex;flex-direction:column;gap:4px;font-family:var(--f-ui);font-size:15px;color:var(--muted)}
label.fl input{border:2px solid var(--paper-3);border-radius:8px;padding:9px;font:16px var(--f-body);background:#fffdf7;color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.winner{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.winner h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;color:var(--ink)}
@media (max-width:420px){.seg button{padding:8px 7px}.hero h1{font-size:42px}}
/* mapa */
.region{stroke:var(--border);stroke-width:1.2}
.nb{fill:var(--nbFill);stroke:var(--nbLine);stroke-width:1.1}
.nblab{font-family:var(--f-ui);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;fill:var(--nbText)}
.track{fill:none;stroke:var(--track);stroke-width:6;stroke-linejoin:round}
.track2{fill:none;stroke:var(--trackEdge);stroke-width:9;stroke-linejoin:round}
.rail2{fill:none;stroke:var(--rail);stroke-width:6}.rail{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:6 6}
.e-sea{fill:none;stroke:var(--seaRoute);stroke-width:3.5;stroke-dasharray:9 7}
.e-air{fill:none;stroke:var(--air);stroke-width:3.5;stroke-dasharray:3 7;stroke-linecap:round}
.tprice{font-family:var(--f-ui);font-weight:700;font-size:16px;fill:var(--rail);paint-order:stroke;stroke:var(--land);stroke-width:4px}
.tile{fill:#fff;stroke:var(--whiteStroke);stroke-width:2.5;cursor:pointer}
.tile.small{stroke-width:2}
.sym{pointer-events:none}
.sy-str{stroke:var(--sym)}.own .sy-str{stroke:var(--ownSym,#fff)}
.sy-fill{fill:var(--sym)}.sy-cut{fill:none;stroke:#fff;stroke-width:1.4}.sy-cut2{fill:#fff}
.own .sy-fill{fill:var(--ownSym,#fff)}.own .sy-cut{stroke:var(--ownBg)}.own .sy-cut2{fill:var(--ownBg)}
.flab{font-family:var(--f-ui);font-weight:500;font-size:15px;fill:var(--text);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;pointer-events:none}
.hide-labels .flab{display:none}
.blab{font-family:var(--f-display);font-size:28px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:5px;pointer-events:none}
.rlab2{font-family:var(--f-ui);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;fill:var(--text);paint-order:stroke;stroke:var(--land);stroke-width:3px}
.leader{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3}
.opt-ring{fill:rgba(255,214,107,.35);stroke:#ffb800;stroke-width:5;animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
.opt-txt{font-family:var(--f-ui);font-weight:700;font-size:26px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:5px;pointer-events:none}
@keyframes pulse{50%{fill:rgba(255,214,107,.7)}}
.trail{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pawn{transition:transform .16s ease-out}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

  const FB_CONFIG = {

  const LIBS = [['fb-app.js', 'firebase-app-compat.js'], ['fb-auth.js', 'firebase-auth-compat.js'], ['fb-db.js', 'firebase-database-compat.js']];

  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });
  }
  async function loadFirebase() {
    for (const [local, cdn] of LIBS) {
      try { await loadScript(local); } catch (e) { await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${VER}/${cdn}`); }
    }
  }

  // ---------- místní napodobenina (testy: ?mock=1) ----------
  function Mock() {
    const KEY = 'italia-mockdb';
    const bc = 'BroadcastChannel' in window ? new BroadcastChannel('italia-mockdb') : null;
    const parts = p => p.split('/').filter(Boolean);
    const clean = v => (v === undefined ? null : JSON.parse(JSON.stringify(v)));
    const skeys = () => Object.keys(localStorage).filter(k => k.startsWith(KEY + ':'));
    function read() {
      const root = {};
      skeys().forEach(k => {
        let v; try { v = JSON.parse(localStorage.getItem(k)); } catch (e) { return; }
        const ks = k.slice(KEY.length + 1).split('/'); let o = root;
        ks.slice(0, -1).forEach(x => { o[x] = o[x] || {}; o = o[x]; }); o[ks[ks.length - 1]] = v;
      });
      return root;
    }
    const getAt = (o, p) => parts(p).reduce((a, k) => (a == null ? null : a[k] == null ? null : a[k]), o);
    function writeShard(sh, v) { if (v == null) localStorage.removeItem(KEY + ':' + sh); else localStorage.setItem(KEY + ':' + sh, JSON.stringify(v)); }
    function setAt(p, v) {
      const ks = parts(p); v = clean(v);
      if (ks.length >= 4) {
        const sh = ks.slice(0, 4).join('/');
        if (ks.length === 4) writeShard(sh, v);
        else {
          let root; try { root = JSON.parse(localStorage.getItem(KEY + ':' + sh)); } catch (e) { root = null; }
          if (typeof root !== 'object' || root == null) root = {};
          let o = root; const rest = ks.slice(4);
          rest.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] == null) o[k] = {}; o = o[k]; });
          if (v == null) delete o[rest[rest.length - 1]]; else o[rest[rest.length - 1]] = v;
          writeShard(sh, root);
        }
      } else {
        const pre = ks.join('/');
        skeys().filter(k => (k.slice(KEY.length + 1) + '/').startsWith(pre + '/')).forEach(k => localStorage.removeItem(k));
        const walk = (val, path) => { if (path.length === 4 || typeof val !== 'object' || val == null) writeShard(path.join('/'), val); else Object.keys(val).forEach(k => walk(val[k], path.concat(k))); };
        if (v != null) walk(v, ks);
      }
      if (bc) bc.postMessage(1);
      notify();
    }
    const listeners = [];
    function notify() {
      const root = read();
      listeners.forEach(l => {
        const v = getAt(root, l.path);
        if (l.type === 'value') { const j = JSON.stringify(v); if (j !== l.last) { l.last = j; l.cb(snap(l.path, v)); } }
        else { Object.keys(v || {}).forEach(k => { if (!l.seen.has(k)) { l.seen.add(k); l.cb(snap(l.path + '/' + k, v[k])); } }); }
      });
    }
    if (bc) bc.onmessage = notify;
    window.addEventListener('storage', e => { if (e.key && e.key.startsWith(KEY)) notify(); });
    const snap = (p, v) => ({ key: parts(p).pop(), val: () => clean(v), exists: () => v != null });
    let n = 0;
    function ref(path) {
      if (path === '.info/connected') return { on: (t, cb) => { setTimeout(() => cb(snap(path, true)), 0); return cb; }, off: () => {} };
      return {
        set: v => { setAt(path, v); return Promise.resolve(); },
        update: o => { Object.keys(o).forEach(k => setAt(path + '/' + k, o[k])); return Promise.resolve(); },
        remove: () => { setAt(path, null); return Promise.resolve(); },
        push: v => { const key = Date.now().toString(36) + (n++).toString(36).padStart(3, '0') + Math.random().toString(36).slice(2, 5); setAt(path + '/' + key, v); return Promise.resolve({ key }); },
        get: () => Promise.resolve(snap(path, getAt(read(), path))),
        transaction: fn => { const cur = getAt(read(), path); const nv = fn(clean(cur)); if (nv === undefined) return Promise.resolve({ committed: false, snapshot: snap(path, cur) }); setAt(path, nv); return Promise.resolve({ committed: true, snapshot: snap(path, nv) }); },
        on: (type, cb) => { const l = { path, type, cb, last: undefined, seen: new Set() }; listeners.push(l); setTimeout(notify, 0); return cb; },
        off: () => { for (let k = listeners.length - 1; k >= 0; k--) if (listeners[k].path === path) listeners.splice(k, 1); },
        onDisconnect: () => ({ set: () => Promise.resolve(), remove: () => Promise.resolve(), cancel: () => Promise.resolve() }),
      };
    }
    let uid = sessionStorage.getItem('mock-uid');
    if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('mock-uid', uid); }
    return { ref: p => ref(p), uid };
  }

  let ready = null;
  const Net = {
    mock: /[?&]mock=1/.test(location.search),
    uid: null,
    ref: null,
    start() {
      if (ready) return ready;
      ready = (async () => {
        if (Net.mock) { const m = Mock(); Net.ref = m.ref; Net.uid = m.uid; return Net.uid; }
        await loadFirebase();
        const fb = window.firebase;
        if (!fb.apps.length) fb.initializeApp(FB_CONFIG);
        const auth = fb.auth();
        const user = await new Promise((res, rej) => {
          const un = auth.onAuthStateChanged(u => { if (u) { un(); res(u); } });
          auth.signInAnonymously().catch(e => { un(); rej(e); });
        });
        const db = fb.database();
        Net.ref = p => db.ref(p);
        Net.uid = user.uid;
        return Net.uid;
      })();
      ready.catch(() => { ready = null; });
      return ready;
    },
  };
  window.Net = Net;
})();

function commit(){
  if(!ON||!ON.host||!g)return;
  if(ON.metaHost&&ON.metaHost!==ON.uid)return;
  const g2=Object.assign({},g,{anim:[],log:[]}),js=JSON.stringify(g2),an=JSON.stringify(g.anim||[]);
  if(js===lastPub&&an==="[]")return;
  lastPub=js;ON.seq++;
  const tail=g.log.slice(ON.logLen||0);ON.logLen=g.log.length;
  gref("state").set({seq:ON.seq,g:js,anim:an,log:JSON.stringify(tail)});
  if(g.phase==="over")gref("meta/status").set("over");
}
function hostListen(){
  ON.queue=[];
  gref("seats").on("value",s=>{ON.seats=s.val()||[];watchSeats();});
  gref("actions").on("child_added",s=>{ON.queue.push(Object.assign({key:s.key},s.val()));hostPump();});
  gref("offer").on("value",s=>onOffer(s.val()));
  watchHost();
}
// odpojený hráč: na jeho tahu ho po 12 s zastoupí počítač, po návratu se mu místo vrátí
function watchSeats(){
  if(!ON||!ON.host||!g)return;
  ON.offT=ON.offT||{};
  (ON.seats||[]).forEach((st,k)=>{
    const p=g.players[k];if(!st||!p||st.ai||ON.mine.has(k))return;
    if(st.on===false&&p.alive&&!p.ai){
      if(!ON.offT[k])ON.offT[k]=setTimeout(()=>{ON.offT[k]=null;const s2=(ON.seats||[])[k];if(ON&&ON.host&&s2&&s2.on===false&&g.players[k].alive&&!g.players[k].ai){g.players[k].ai=true;g.players[k].sub=true;g.players[k].level=g.players[k].level||2;g.log.push(`${g.players[k].name} je odpojen – zatím za něj hraje počítač.`);play().then(aiLoop);}},12000);
    }else if(st.on!==false){clearTimeout(ON.offT[k]);ON.offT[k]=null;
      if(p.sub&&p.ai){p.ai=false;p.sub=false;g.log.push(`${p.name} se vrátil do hry.`);if(!busy)play();}}
  });
}
const SEAT_OK={pickBank:a=>null,roll:a=>null,choose:a=>null,buy:a=>null,bankrupt:a=>null,
  sell:a=>a[0],buyCard:a=>a[0],placeClub:a=>a[0],doTrade:a=>[a[0]&&a[0].a,a[0]&&a[0].b],blockTrade:a=>[a[0],a[1]]};
async function hostPump(){
  if(!ON||!ON.host||busy||ON.pumping||!g)return;
  ON.pumping=true;
  try{
    while(ON&&ON.queue.length&&!busy){
      const a=ON.queue.shift();gref("actions/"+a.key).remove();
      let args=[];try{args=JSON.parse(a.args);}catch(e){continue;}
      const seat=a.seat,st=(ON.seats||[])[seat],p=g.players[seat];
      let ok=!!(st&&st.uid===a.uid&&p&&p.alive&&!p.ai&&ENG[a.fn]);
      if(ok){const w=SEAT_OK[a.fn](args);ok=w===null?g.cur===seat:Array.isArray(w)?w.includes(seat):w===seat;}
      let r=false;
      if(ok){try{r=ENG[a.fn](g,...args);}catch(e){console.warn(e);r=false;}}
      if(!ok||r===false){gref("err").set({seat,text:"Tah nebyl přijat.",t:Date.now()});}
      await play();
    }
  }finally{if(ON)ON.pumping=false;}
  aiLoop();
}
// ---------- připojený hráč ----------
function sendAction(fn,args){
  if(!ON)return;
  ON.wait=true;
  gref("actions").push({uid:ON.uid,seat:[...ON.mine][0],fn,args:JSON.stringify(args),t:Date.now()});
  clearTimeout(ON.waitT);
  ON.waitT=setTimeout(()=>{if(ON&&ON.wait){ON.wait=false;toast("Zakladatel hry neodpovídá – je připojen?","minus",4000);if(g)renderPanel();}},15000);
  if(g)renderPanel();
}
function clientListen(){
  ON.inbox=[];
  gref("state").on("value",s=>{const v=s.val();if(v){ON.inbox.push(v);clientPump();}});
  ON.errInit=false;
  gref("err").on("value",s=>{const v=s.val();if(!ON.errInit){ON.errInit=true;return;}if(v&&ON&&ON.mine.has(v.seat)){ON.wait=false;toast(v.text,"minus");if(g)renderPanel();}});
  gref("offer").on("value",s=>onOffer(s.val()));
  gref("seats").on("value",s=>{ON.seats=s.val()||[];});
  watchHost();
  presence(`${ROOT}/${ON.code}/seats/${[...ON.mine][0]}/on`);
}
async function clientPump(){
  if(!ON||ON.host||busy||ON.pumping)return;
  ON.pumping=true;
  try{
    while(ON&&ON.inbox.length&&!busy){
      const v=ON.inbox.shift();
      if(v.seq<=ON.seq)continue;
      const ng=JSON.parse(v.g);let tail=[];try{tail=JSON.parse(v.log||"[]");}catch(e){}
      ng.log=((g&&g.log)||[]).concat(tail).slice(-200);
      const first=!g||ON.seq<0;
      ON.seq=v.seq;ON.wait=false;clearTimeout(ON.waitT);
      if(first){ng.anim=[];startGame(ng);await new Promise(r=>setTimeout(r,80));continue;}
      ng.anim=JSON.parse(v.anim||"[]");g=ng;
      await play();
    }
  }finally{if(ON)ON.pumping=false;}
}
// ---------- odchod a převzetí hry ----------
function watchHost(){
  gref("meta").on("value",s=>{
    const m=s.val();if(!ON||!m)return;
    if(ON.host){ON.metaHost=m.host;if(m.host&&m.host!==ON.uid)demote();return;}
    if(m.host!==ON.hostUid){ON.hostUid=m.host;hostBack();}
    if(m.status==="cancel"&&!g){leaveOnline(true);toast("Zakladatel hru zrušil.","minus");showSetup();return;}
    if(!g)return;
    if(m.hostOn===false){if(!ON.gone){clearTimeout(ON.goneT);ON.goneT=setTimeout(hostGone,12000);}}
    else{clearTimeout(ON.goneT);if(ON.gone)hostBack();}
  });
}
function hostGone(){
  if(!ON||ON.host||ON.gone||!g)return;
  ON.gone=true;
  // nejdřív nabídne převzetí prvnímu připojenému hráči v pořadí, po 30 s všem
  const me=[...ON.mine][0],order=(ON.seats||[]).map((st,k)=>k).filter(k=>{const st=ON.seats[k],p=g.players[k];return st&&st.uid&&st.uid!==ON.hostUid&&!st.ai&&st.on!==false&&p&&p.alive;});
  if(order[0]===me)offerTakeover();else{toast("Zakladatel je odpojen. Hru převezme další hráč…","",4500);ON.takeT=setTimeout(offerTakeover,30000);}
}
function hostBack(){if(!ON)return;ON.gone=false;clearTimeout(ON.takeT);clearTimeout(ON.goneT);if(ON.takeSheet){const t=ON.takeSheet;ON.takeSheet=null;t.close();}}
function offerTakeover(){
  if(!ON||!ON.gone||ON.host||!g||ON.takeSheet)return;
  ON.takeSheet=sheet("Zakladatel je odpojen",(b,close)=>{
    b.append(h("p",{style:"margin:0"},"Zakladatel hry je odpojen. Převezměte hru, ať může pokračovat – vaše zařízení ji pak bude řídit a hrát za počítače."),
      h("button",{class:"btn red big",onclick:()=>{close();takeOver();}},`Převzít hru ${ON.code}`));
  },()=>{if(ON)ON.takeSheet=null;});
}
async function takeOver(){
  const uid=ON.uid;
  const r=await gref("meta").transaction(m=>{if(m==null)return null;if(m.hostOn===false&&m.host!==uid)return Object.assign({},m,{host:uid,hostOn:true});return undefined;});
  if(!r.committed||!r.snapshot.val()||r.snapshot.val().host!==uid){toast("Hru už převzal někdo jiný, nebo se zakladatel vrátil.","minus");hostBack();return;}
  hostBack();
  ["state","err","offer","meta","seats"].forEach(p=>gref(p).off());
  useRemoteEngine(false);
  ON.host=true;ON.gone=false;ON.metaHost=uid;ON.logLen=g.log.length;lastPub="";
  hostListen();presence(`${ROOT}/${ON.code}/meta/hostOn`);onlineSave();
  toast("Převzal jste hru – vaše zařízení ji teď řídí.","plus",4000);
  await play();aiLoop();
}
function demote(){
  if(!ON||!ON.host)return;
  ["actions","offer","meta","seats"].forEach(p=>gref(p).off());
  ON.host=false;ON.seq=-1;ON.inbox=[];
  useRemoteEngine(true);clientListen();onlineSave();
  toast("Hru mezitím převzal jiný hráč. Pokračujete jako připojený hráč.","",4500);
}
function quitOnline(){
  if(!ON)return;
  if(ON.host)gref("meta").update({hostOn:false});
  const k=[...ON.mine][0];if(k!=null)gref("seats/"+k+"/on").set(false);
  leaveOnline(false);
}
// ---------- obchod mezi zařízeními ----------
function sendOffer(t){gref("offer").set({t:JSON.stringify(t),id:Date.now()+"-"+ON.uid});toast(`Nabídka odeslána hráči ${g.players[t.b].name}.`);}
function onOffer(o){
  if(!ON||!o||!g)return;
  let t;try{t=JSON.parse(o.t);}catch(e){return;}
  if(o.answer){
    if(ON.mine.has(t.a)&&ON.lastAns!==o.id){ON.lastAns=o.id;gref("offer").remove();
      if(o.answer==="yes")toast(`${g.players[t.b].name} přijímá obchod.`,"plus");
      else if(o.answer==="no")toast(`${g.players[t.b].name} nabídku odmítá. Další obchod až v příštím kole.`,"minus");
      else toast(`${g.players[t.b].name} připravuje protinávrh…`);}
    return;
  }
  if(!ON.mine.has(t.b)||ON.seenOffer===o.id)return;
  ON.seenOffer=o.id;
  offerSheet(t,ans=>gref("offer").update({answer:ans}));
}
// ---------- lobby ----------
function shareLink(code){return location.origin+location.pathname+"?hra="+code;}
async function newCode(){
  for(let k=0;k<20;k++){
    const c=Array.from({length:4},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join("");
    const s=await Net.ref(ROOT+"/"+c+"/meta").get();
    if(!s.exists()||(s.val().created||0)<Date.now()-30*864e5)return c;
  }
  throw new Error("kód");
}
async function createOnline(){
  if(ON)quitOnline();
  const ps=[...setupPlayers].sort((a,b)=>ORDER.indexOf(a.color)-ORDER.indexOf(b.color));
  const hostSeat=ps.findIndex(p=>!p.ai);
  if(hostSeat<0||ps.filter(p=>!p.ai).length<2){sheet("Online hra",(b,cl)=>b.append(h("p",{style:"margin:0"},"Nastavte aspoň dva hráče jako „Člověk“. První z nich jste vy, ostatní se připojí ze svých zařízení. Počítače hrají na vašem zařízení."),h("button",{class:"btn",onclick:cl},"Rozumím")));return;}
  if(!(await netStart()))return;
  const code=await newCode();
  const seats=ps.map((p,k)=>({name:(p.name||"").trim()||(p.ai?"Počítač ":"Hráč ")+(k+1),color:p.color,ai:!!p.ai,uid:k===hostSeat?Net.uid:"",level:p.ai?aiLevel:0}));
  await Net.ref(ROOT+"/"+code).update({meta:{host:Net.uid,status:"lobby",created:Date.now(),app:"italia",game:"EWAS",country:"Italia",hostOn:true,
    opts:{cash:setCash,targetCash:victory==="cash"?targetCash:0,targetTiles:victory==="tiles"?targetTiles:0}},seats,state:null,actions:null,offer:null,err:null});
  ON={code,host:true,uid:Net.uid,mine:new Set([hostSeat]),seq:0,seats};
  onlineSave();showLobby();
}
function joinSheet(code){
  sheet("Připojit se k online hře",(b,close)=>{
    const ci=h("input",{value:code||"",maxlength:4,autocapitalize:"characters",placeholder:"např. KX7P",class:"codeinp",oninput:e=>{e.target.value=e.target.value.toUpperCase();}});
    let myname="";try{myname=localStorage.getItem("italia-myname")||"";}catch(e){}
    const ni=h("input",{value:myname,maxlength:14,placeholder:"Vaše jméno",class:"codeinp name"});
    b.append(h("label",{class:"fl"},"Kód hry od zakladatele",ci),h("label",{class:"fl"},"Vaše jméno",ni));
    const go=h("button",{class:"btn red big",onclick:async()=>{
      const c=ci.value.trim().toUpperCase(),nm=ni.value.trim();
      if(c.length!==4){toast("Zadejte čtyřmístný kód hry.","minus");return;}
      try{localStorage.setItem("italia-myname",nm);}catch(e){}
      go.disabled=true;const ok=await joinOnline(c,nm);go.disabled=false;if(ok)close();
    }},"Připojit se");
    b.append(go);
  });
}
async function joinOnline(code,name){
  if(!(await netStart()))return false;
  const snap=await Net.ref(ROOT+"/"+code).get();
  if(!snap.exists()){toast("Hra s tímto kódem neexistuje.","minus");return false;}
  const gm=snap.val(),seats=gm.seats||[];
  if(!gm.meta||gm.meta.app!=="italia"){toast("Tento kód nepatří ke hře Italia.","minus",4500);return false;}
  if(gm.meta.host===Net.uid)return resumeOnline({code,host:true});
  let seat=seats.findIndex(s=>s&&s.uid===Net.uid);
  if(seat<0){
    if(gm.meta.status!=="lobby"){toast("Tato hra už začala a nemá pro vás volné místo.","minus");return false;}
    for(let k=0;k<seats.length&&seat<0;k++){
      if(!seats[k]||seats[k].ai||seats[k].uid)continue;
      const r=await Net.ref(`${ROOT}/${code}/seats/${k}`).transaction(cur=>(cur==null?null:!cur.ai&&!cur.uid?Object.assign({},cur,{uid:Net.uid,name:name||cur.name}):undefined));
      if(r.committed&&r.snapshot.val()&&r.snapshot.val().uid===Net.uid)seat=k;
    }
    if(seat<0){toast("Ve hře už není volné místo.","minus");return false;}
  }
  ON={code,host:false,uid:Net.uid,mine:new Set([seat]),seq:-1,hostUid:gm.meta.host};
  useRemoteEngine(true);onlineSave();clientListen();
  if(gm.meta.status==="lobby")showLobby();
  return true;
}
async function resumeOnline(os){
  if(!(await netStart()))return false;
  const snap=await Net.ref(ROOT+"/"+os.code).get();
  if(!snap.exists()){toast("Online hra už neexistuje.","minus");onlineForget();showSetup();return false;}
  const gm=snap.val(),seats=gm.seats||[];
  if(gm.meta.host!==Net.uid)return joinOnline(os.code,"");
  ON={code:os.code,host:true,uid:Net.uid,mine:new Set([seats.findIndex(s=>s&&s.uid===Net.uid)]),seq:(gm.state&&gm.state.seq)||0,seats,metaHost:Net.uid};
  onlineSave();
  if(gm.meta.status==="lobby"||!gm.state){showLobby();return true;}
  const ng=JSON.parse(gm.state.g);ng.anim=[];ng.log=[];
  gref("meta").update({hostOn:true});
  hostListen();presence(`${ROOT}/${ON.code}/meta/hostOn`);
  ON.logLen=0;lastPub="";startGame(ng);
  return true;
}
function showLobby(){
  g=null;$("app").hidden=true;
  const S=$("setup");S.hidden=false;S.innerHTML="";
  const card=h("div",{class:"setup-card"}),list=h("div",{class:"lobbylist"});
  S.append(heroEl(),card);
  card.append(h("div",{class:"sec"},"Online hra"),h("div",{class:"codebox"},h("small",null,"Kód hry"),h("b",{id:"gamecode"},ON.code)));
  if(ON.host){
    card.append(h("p",{class:"note"},"Pošlete kód nebo odkaz ostatním hráčům. Připojí se ve hře Italia tlačítkem „Připojit se“."),
      h("button",{class:"btn soft",onclick:async()=>{
        const url=shareLink(ON.code),text=`Zahraj si se mnou Italia! Kód hry: ${ON.code}`;
        try{if(navigator.share){await navigator.share({title:"Italia – online hra",text,url});return;}}catch(e){return;}
        try{await navigator.clipboard.writeText(text+" "+url);toast("Odkaz zkopírován.");}catch(e){toast(url,"",6000);}
      }},"Sdílet odkaz"));
  }else card.append(h("p",{class:"note"},"Jste připojen. Hra začne, až ji zakladatel spustí."));
  card.append(list);
  if(ON.host)card.append(h("button",{class:"btn red big",onclick:hostStart},"Začít hru"),h("p",{class:"note"},"Místa, kam se nikdo nepřipojí, převezme počítač."));
  card.append(h("button",{class:"btn ghost",onclick:()=>confirmBox(ON.host?"Zrušit online hru?":"Opustit online hru?",ON.host?"Zrušit":"Opustit",()=>{
    if(ON.host)gref("meta/status").set("cancel");else{const k=[...ON.mine][0];gref("seats/"+k+"/uid").set("");}
    leaveOnline(true);showSetup();})},ON.host?"Zrušit hru":"Opustit"));
  gref("seats").on("value",s=>{
    const seats=s.val()||[];if(!ON)return;ON.seats=seats;list.innerHTML="";
    seats.forEach((st,k)=>{if(!st)return;const me=ON.mine.has(k);
      list.append(h("div",{class:"lobbyrow"+(st.ai||st.uid?"":" free")},h("span",{html:pawnSVG(st.color,28)}),h("b",null,st.name+(me?" (vy)":"")),
        h("span",{class:"tag"},st.ai?"počítač":st.uid?"připojen":"čeká na hráče…")));});
  });
  if(!ON.host){gref("meta").on("value",s=>{const m=s.val();if(!ON||!m)return;if(m.status==="cancel"){leaveOnline(true);toast("Zakladatel hru zrušil.","minus");showSetup();}});}
}
async function hostStart(){
  const gm=(await gref().get()).val(),seats=gm.seats||[];
  const ps=seats.map(st=>{const ai=st.ai||!st.uid;return{name:st.name,color:st.color,ai,level:ai?(st.level||aiLevel):0};});
  seats.forEach((st,k)=>{if(!st.ai&&!st.uid)gref("seats/"+k).update({ai:true});});
  gref("seats").off();
  await gref("meta/status").set("play");
  const ng=E.newGame(ps,gm.meta.opts||{});
  hostListen();
  presence(`${ROOT}/${ON.code}/meta/hostOn`);
  presence(`${ROOT}/${ON.code}/seats/${[...ON.mine][0]}/on`);
  ON.logLen=0;lastPub="";
  startGame(ng);commit();
}

$("menuBtn").onclick=openMenu;
function start(data){
  drawMap();
  if(data&&data.g){startGame(data.g);return;}
  showSetup();
  const m=location.search.match(/[?&]hra=([A-Za-z0-9]{4})/);
  if(m&&ONLINE_OK)joinSheet(m[1].toUpperCase());
}
if(window.claude&&window.claude.hot)window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({g}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
