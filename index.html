<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Immigrants">
<title>Immigrants USA</title>
<meta name="theme-color" content="#14203b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>/* Layout: celoobrazovková aplikace – horní pás hráčů, mapa s posunem/zoomem, dolní „lístek" s akcemi. */
[hidden] { display: none !important; }
:root {
  --ink: #14203b;
  --ink-2: #22345e;
  --ink-3: #3a4d7a;
  --paper: #f1e9d6;
  --paper-2: #e4d8bd;
  --paper-3: #d3c39f;
  --stamp: #c62420;
  --stamp-2: #9e1714;
  --gold: #b88a2c;
  --text: #1a2036;
  --muted: #5f6070;
  --ok: #2c7a3f;
  --sea: #b7dde6;
  --f-display: 'Alfa Slab One', 'Rockwell', 'Georgia', serif;
  --f-ui: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: var(--f-body); font-size: 15px; overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* ---------- horní pás ---------- */
#topbar { flex: none; display: flex; align-items: stretch; gap: 6px; background: var(--ink);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px));
  border-bottom: 3px solid var(--stamp); }
#chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 5px; border-radius: 6px;
  background: var(--ink-2); color: #e9e3d2; border: 1px solid transparent; font-family: var(--f-ui); line-height: 1.05; }
.chip.cur { background: var(--paper); color: var(--text); border-color: var(--gold); }
.chip.dead { opacity: .4; text-decoration: line-through; }
.chip .nm { font-weight: 600; font-size: 14px; max-width: 86px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .cs { font-size: 13px; opacity: .85; }
.chip .meta { display: flex; flex-direction: column; }
.chip.debt .cs { color: var(--stamp); opacity: 1; font-weight: 700; }
#lastroll { position: absolute; top: 9px; left: 10px; z-index: 4; display: flex; align-items: center; gap: 5px; padding: 6px 9px; border-radius: 9px;
  background: var(--paper); border: 2px solid var(--ink); border-top: 4px solid var(--pc, var(--ink)); box-shadow: 0 4px 12px rgba(0,0,0,.28);
  transition: left .35s ease; pointer-events: none; }
#lastroll::before { content: ""; position: absolute; top: -12px; left: var(--ax, 22px); border: 7px solid transparent; border-bottom-color: var(--pc, var(--ink)); transform: translateX(-50%); transition: left .35s ease; }
#lastroll .die { width: 30px; height: 30px; border-radius: 6px; padding: 4px; border-width: 1.5px; box-shadow: 0 1px 0 var(--ink); }
#lastroll .die i { width: 5px; height: 5px; }
#lastroll .sum { font-family: var(--f-ui); font-weight: 700; color: var(--ink); font-size: 19px; margin-left: 2px; }
#lastroll .who { font-family: var(--f-ui); font-size: 13px; color: var(--muted); margin-right: 2px; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { flex: none; width: 40px; border-radius: 6px; border: 0; background: var(--ink-2); color: #efe8d6; display: grid; place-items: center; }
.iconbtn svg { width: 22px; height: 22px; }

/* hvězdná značka hráče */
.star-badge { width: 26px; height: 26px; flex: none; }

/* ---------- mapa ---------- */
#mapwrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--sea); touch-action: none; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#world img { display: block; max-width: none; pointer-events: none; -webkit-user-drag: none; }
#overlay { position: absolute; left: 0; top: 0; overflow: visible; }
.mapctl { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; flex-direction: column; gap: 6px; }
.mapctl button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid rgba(20,32,59,.25); background: rgba(241,233,214,.94); color: var(--ink); font-size: 20px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,.18); display: grid; place-items: center; }
.mapctl button svg { width: 20px; height: 20px; }
#steps { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 66px; background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 8px; font-family: var(--f-ui); font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
#steps b { font-size: 22px; color: #ffd66b; margin-right: 4px; }

.opt-ring { fill: rgba(255, 214, 107, .35); stroke: #ffb800; animation: pulse 1.1s ease-in-out infinite; cursor: pointer; }
.opt-txt { font-family: var(--f-ui); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: #fff; pointer-events: none; }
@keyframes pulse { 50% { fill: rgba(255, 214, 107, .7); } }
.trail { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.pawn { transition: transform .16s ease-out; }
.mk { cursor: pointer; }

/* ---------- dolní panel ---------- */
#panel { flex: none; background: var(--paper); border-top: 3px solid var(--ink); position: relative;
  padding: 10px max(14px, env(safe-area-inset-right, 0px)) 12px max(14px, env(safe-area-inset-left, 0px));
  max-height: 46vh; overflow-y: auto; box-shadow: 0 -6px 18px rgba(0,0,0,.25); }
#panel::before { content: ""; position: absolute; left: 0; right: 0; top: -9px; height: 6px;
  background: radial-gradient(circle at 6px 6px, var(--paper) 3px, transparent 3.5px) 0 0 / 12px 6px repeat-x; }
.ph { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.ph h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 21px; letter-spacing: .3px; color: var(--ink); line-height: 1.1; text-wrap: balance; }
.ph .sub { font-family: var(--f-ui); font-size: 14px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
.btn { border: 0; border-radius: 8px; padding: 11px 14px; font-family: var(--f-ui); font-size: 17px; font-weight: 600; letter-spacing: .3px;
  background: var(--ink); color: var(--paper); min-height: 46px; }
.btn.red { background: var(--stamp); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
.btn.soft { background: var(--paper-2); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { font-size: 21px; min-height: 56px; }
.btn small { display: block; font-size: 12.5px; font-weight: 500; opacity: .85; letter-spacing: 0; }
.dicesel { display: flex; gap: 6px; margin: 2px 0 10px; }
.dicesel button { flex: 1; border: 2px solid var(--paper-3); background: var(--paper); border-radius: 8px; padding: 5px 2px; font-family: var(--f-ui); line-height: 1.1; }
.dicesel button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.dicesel b { font-size: 17px; display: block; }
.dicesel span { font-size: 12px; opacity: .8; }

.wallet { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.wallet .amt { font-family: var(--f-display); font-size: 26px; color: var(--ink); }
.bills { position: relative; height: 40px; flex: 1; min-width: 0; }
.bills img { position: absolute; top: 0; height: 38px; width: auto; border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.35); }

.dice { display: flex; gap: 8px; justify-content: center; margin: 4px 0 10px; }
.die { width: 46px; height: 46px; border-radius: 9px; background: #fff; border: 2px solid var(--ink); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 6px; box-sizing: border-box; box-shadow: 0 2px 0 var(--ink); }
.die i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); place-self: center; visibility: hidden; }
.die i.on { visibility: visible; }
.die.roll { animation: shake .5s ease-in-out; }
@keyframes shake { 20% { transform: rotate(-14deg) translateY(-4px); } 50% { transform: rotate(12deg); } 80% { transform: rotate(-5deg); } }

.optlist { display: flex; flex-direction: column; gap: 6px; }
.optlist button { display: flex; align-items: center; gap: 10px; text-align: left; border: 2px solid var(--paper-3); background: #fbf7ec; border-radius: 8px; padding: 8px 10px; font-family: var(--f-ui); font-size: 16px; }
.optlist button .k { width: 26px; height: 26px; border-radius: 50%; background: #ffd66b; border: 2px solid #c08a00; display: grid; place-items: center; font-weight: 700; flex: none; }
.optlist button .cost { margin-left: auto; color: var(--stamp); font-weight: 700; white-space: nowrap; }
.optlist button .cost.free { color: var(--ok); }

.cardrow { display: flex; gap: 12px; align-items: flex-start; }
.cardrow img.card { width: 96px; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,.3); flex: none; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-family: var(--f-ui); font-size: 16px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; text-align: right; }

.thinking { display: flex; align-items: center; gap: 10px; font-family: var(--f-ui); font-size: 17px; }
.spinner { width: 22px; height: 22px; border: 3px solid var(--paper-3); border-top-color: var(--stamp); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- listy (sheety) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,16,32,.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 88%; background: var(--paper); border-radius: 14px 14px 0 0; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.sheet header { display: flex; align-items: center; gap: 10px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 2px solid var(--paper-3); }
.sheet header h3 { margin: 0; flex: 1; font-family: var(--f-display); font-weight: 400; font-size: 20px; color: var(--ink); }
.sheet .body { overflow-y: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.sheet .close { border: 0; background: var(--paper-2); border-radius: 50%; width: 36px; height: 36px; font-size: 20px; }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; border: 0; border-radius: 8px; padding: 8px; font-family: var(--f-ui); font-size: 16px; font-weight: 600; background: var(--paper-2); color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }

.item { display: flex; gap: 12px; align-items: center; background: #fbf7ec; border: 1px solid var(--paper-3); border-radius: 10px; padding: 8px; }
.item img { width: 86px; border-radius: 5px; flex: none; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.item img.tall { width: 54px; }
.item .t { flex: 1; min-width: 0; }
.item .t b { font-family: var(--f-ui); font-size: 17px; display: block; color: var(--ink); }
.item .t p { margin: 2px 0 6px; font-size: 13px; color: var(--muted); line-height: 1.3; }
.item .t .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.item .t .acts button { border: 0; border-radius: 6px; padding: 6px 10px; background: var(--ink); color: var(--paper); font-family: var(--f-ui); font-size: 14.5px; font-weight: 600; }
.item .t .acts button.alt { background: var(--paper-2); color: var(--ink); }
.item .t .acts button:disabled { opacity: .4; }
.tag { display: inline-block; font-family: var(--f-ui); font-size: 13px; padding: 1px 7px; border-radius: 10px; background: var(--paper-2); color: var(--ink); margin-right: 4px; }
.tag.red { background: var(--stamp); color: #fff; }
.err { color: var(--stamp); font-size: 13px; font-family: var(--f-ui); }
.note { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
.sec { font-family: var(--f-ui); text-transform: uppercase; letter-spacing: 1.2px; font-size: 13px; color: var(--muted); margin: 6px 0 -2px; }

/* ---------- toasty ---------- */
#toasts { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 112px); transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 460px); }
.toast { background: rgba(20,32,59,.94); color: var(--paper); padding: 8px 12px; border-radius: 8px; font-family: var(--f-ui); font-size: 15.5px; box-shadow: 0 4px 14px rgba(0,0,0,.3); animation: tin .2s ease-out; max-width: 100%; }
.toast.minus { border-left: 5px solid var(--stamp); }
.toast.plus { border-left: 5px solid #5cc57a; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
.flybill { position: fixed; height: 30px; width: auto; z-index: 70; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,.4); border-radius: 2px; }

/* ---------- úvodní obrazovka ---------- */
#setup { position: fixed; inset: 0; overflow-y: auto; background: var(--ink); z-index: 40;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
.hero { max-width: 560px; margin: 0 auto 16px; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 16 / 9; max-width: 100%;
  background: url('img/board.jpg') 88% 2% / 520% auto no-repeat; border: 3px solid var(--paper); }
.hero::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 -60px 50px -20px rgba(20,32,59,.65); }
.hero-wrap { max-width: 560px; margin: 0 auto; }
.setup-card { max-width: 560px; margin: 0 auto; background: var(--paper); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.setup-card h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--ink); line-height: 1.1; text-wrap: balance; }
.setup-card .lead { margin: -4px 0 0; color: var(--muted); font-size: 14.5px; }
.prow { display: flex; align-items: center; gap: 8px; }
.prow input { flex: 1; min-width: 0; border: 2px solid var(--paper-3); border-radius: 8px; padding: 9px 10px; font: 16px var(--f-body); background: #fffdf7; color: var(--text); }
.seg { display: flex; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: 8px 10px; font-family: var(--f-ui); font-size: 15px; font-weight: 600; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.rm { border: 0; background: transparent; font-size: 22px; color: var(--muted); width: 32px; }
select { border: 2px solid var(--paper-3); border-radius: 8px; padding: 9px; font: 16px var(--f-body); background: #fffdf7; color: var(--text); }
label.fl { display: flex; flex-direction: column; gap: 4px; font-family: var(--f-ui); font-size: 15px; color: var(--muted); }

/* výsledná obrazovka */
.winner { text-align: center; padding: 10px 0; }
.winner h2 { font-family: var(--f-display); font-weight: 400; font-size: 30px; margin: 6px 0; color: var(--ink); }

.rules h4 { font-family: var(--f-ui); font-size: 17px; margin: 8px 0 2px; color: var(--ink); }
.rules p, .rules li { font-size: 14.5px; line-height: 1.45; }
.rules ul { padding-left: 18px; margin: 4px 0; }

/* plovoucí panel vpravo dole: počítač a telefon na šířku */
@media (min-width: 900px), (orientation: landscape) and (max-height: 600px) {
  #panel { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); width: 380px; max-width: 46vw; max-height: 70vh; border: 3px solid var(--ink); border-radius: 12px; z-index: 5; }
  #panel::before { display: none; }
  #panel .ptoggle { display: grid; }
  #panel.mini { width: auto; max-width: 60vw; padding-top: 6px; padding-bottom: 6px; }
  #panel.mini > :not(.ph):not(.ptoggle) { display: none !important; }
  #panel.mini .ph { margin: 0; padding-right: 40px; }
  #panel.mini .ph .sub { display: none; }
}
@media (orientation: landscape) and (max-height: 600px) {
  #topbar { padding-top: 3px; padding-bottom: 3px; }
  .chip { padding: 2px 8px 2px 4px; }
  .chip .star-badge, #topbar .star-badge { width: 20px; height: 20px; }
  .iconbtn { width: 36px; }
  #panel { width: 330px; max-height: calc(100% - 20px); padding: 8px 12px 10px; }
  .ph { margin-bottom: 6px; padding-right: 40px; }
  .ph h2 { font-size: 18px; }
  .ph .star-badge { width: 26px; height: 26px; }
  .wallet { margin-bottom: 6px; }
  .wallet .amt { font-size: 21px; }
  .bills { height: 30px; } .bills img { height: 28px; }
  .dicesel { margin: 0 0 6px; } .dicesel button { padding: 3px 2px; } .dicesel b { font-size: 15px; }
  .btn { min-height: 40px; padding: 8px 10px; font-size: 16px; }
  .btn.big { min-height: 46px; font-size: 18px; }
  .optlist button { padding: 6px 8px; font-size: 15px; }
  .cardrow img.card { width: 70px; }
  .die { width: 38px; height: 38px; }
  .mapctl { top: 8px; flex-direction: row; }
  .mapctl button { width: 36px; height: 36px; }
  #steps { top: 62px; }
  #panel { max-height: calc(100% - 64px); }
}
.ptoggle { display: none; position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border: 0; border-radius: 8px; background: var(--paper-2); color: var(--ink); place-items: center; font-size: 20px; font-weight: 700; line-height: 1; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

.colorbtn { border: 2px solid var(--paper-3); background: #fffdf7; border-radius: 50%; width: 46px; height: 46px; display: grid; place-items: center; padding: 0; flex: none; }
.colorgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.colorpick { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid var(--paper-3); background: #fbf7ec; border-radius: 10px; padding: 10px 4px; font-family: var(--f-ui); }
.colorpick b { font-size: 16px; color: var(--ink); }
.colorpick small { font-size: 13px; color: var(--muted); }
.colorpick[aria-pressed="true"] { border-color: var(--ink); background: var(--paper-2); }
</style>
</head>
<body>
<div id="setup" hidden></div>
<div id="app" hidden>
  <div id="topbar">
    <div id="chips" aria-label="Hráči"></div>
    <button class="iconbtn" id="menuBtn" aria-label="Nabídka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="mapwrap">
    <div id="world"><img src="img/board.jpg" width="3925" height="2426" alt="Herní deska – mapa USA s trasami"><svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="lastroll" hidden aria-label="Poslední hod"></div>
    <div id="steps" hidden></div>
    <div class="mapctl">
      <button id="zin" aria-label="Přiblížit">+</button>
      <button id="zout" aria-label="Oddálit">−</button>
      <button id="zfit" aria-label="Celá mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="zme" aria-label="Ukázat figurku na tahu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    </div>
  </div>
  <div id="panel" aria-live="polite"></div>

        ev(g, out, { t: 'bank', p: i, bank: 'SNB', text: `${p.name} projíždí Second National Bank (${sv}).` });
        if (cnt) pay(g, out, holder, i, 1000 * cnt, `Second National Bank – podíl za ${cnt} států`);
        startTrip(p, v);
      }
    }
  }

  function mafiaCheck(g, out, i, v) {
    const m = g.cards.mafia;
    if (!m || m.owner < 0) return;
    const holder = m.owner;
    if (!P(g, holder).alive || v === FED || v === BC) return;
    if (holder === i) {
      g.players.forEach(q => {
        if (q.id !== i && q.alive && q.node === v) eliminate(g, out, q.id, `${q.name} byl vyřazen Mafií hráče ${P(g, i).name}.`);
      });
    } else if (P(g, holder).node === v) {

    }
  }

  // ---------- banky ----------
  function arriveBank(g, out, i, bank) {
    const p = P(g, i);
    const items = [];
    if (bank === FED) {
      // legalizace
      const newly = ownedStates(g, i).filter(s => !g.states[s].legal);
      newly.forEach(s => { g.states[s].legal = true; });
      if (newly.length) ev(g, out, { t: 'legal', p: i, states: newly, text: `${p.name} legalizoval ${newly.length} ${newly.length === 1 ? 'stát' : newly.length < 5 ? 'státy' : 'států'}.` });
      if (!p.bonusFED) { p.bonusFED = true; items.push({ label: 'Bonus za první příjezd', amt: BONUS_FIRST }); }
      ownedStates(g, i).forEach(s => {
        if (s === 'California') items.push({ label: 'California (karta)', amt: 30000 });
        else if (D.states[s].fed) items.push({ label: s, amt: D.states[s].fed });
      });
      if (hasCard(g, i, 'snb')) items.push({ label: 'Second National Bank', amt: 15000 });
      const total = items.reduce((s, x) => s + x.amt, 0);
      ev(g, out, { t: 'bank', p: i, bank: 'FED', items, total, text: `${p.name} dorazil do banky FED (New York) a inkasuje ${fmt(total)}.` });
      if (total) pay(g, out, -1, i, total, 'Výplata banky FED');
      // vrácení Mafie
      if (hasCard(g, i, 'mafia')) { delete g.cards.mafia; ev(g, out, { t: 'msg', text: `${p.name} vrací kartu Mafia.` }); }
      if (p.circuit === 1) p.circuit = 2;
    } else {
      if (!p.bonusBC) { p.bonusBC = true; items.push({ label: 'Bonus za první příjezd', amt: BONUS_FIRST }); }
      const co = caliOwner(g);
      const payer = co >= 0 && co !== i && P(g, co).alive ? co : -1;
      let sub = 0;
      if (co !== i) {
        const m = profitMult(g, i);
        ownedStates(g, i).forEach(s => { if (D.states[s].bc) { items.push({ label: s + (m > 1 ? ` ×${m}` : ''), amt: D.states[s].bc * m }); sub += D.states[s].bc * m; } });
      }
      const total = items.reduce((s, x) => s + x.amt, 0);
      ev(g, out, { t: 'bank', p: i, bank: 'BC', items, total, payer, text: co === i ? `${p.name} vlastní Californii – v Sacramentu nic neinkasuje.` : `${p.name} dorazil do banky BC (Sacramento) a inkasuje ${fmt(total)}${payer >= 0 ? ` (podíl vyplácí ${P(g, payer).name})` : ''}.` });
      const bonus = total - sub;
      if (bonus) pay(g, out, -1, i, bonus, 'Bonus BC');
      if (sub) { if (payer >= 0) pay(g, out, payer, i, sub, 'Výplata v BC (majitel Californie)'); else pay(g, out, -1, i, sub, 'Výplata banky BC'); }
      if (p.circuit === 0) p.circuit = 1;
    }
    startTrip(p, bank);
  }

  // ---------- vyřazení ----------
  function releaseAssets(g, i) {
    Object.keys(g.states).forEach(s => {
      const st = g.states[s];
      if (st.owner === i) { if (st.label) g.labelsLeft[st.label]++; g.states[s] = { owner: -1, legal: false, label: null }; }
    });
    Object.keys(g.cards).forEach(c => { if (g.cards[c].owner === i) delete g.cards[c]; });
    if (g.snb && !g.cards.snb) g.snb = null;
  }
  function eliminate(g, out, i, text) {
    const p = P(g, i);
    if (!p.alive) return;
    p.alive = false; p.cash = 0;
    releaseAssets(g, i);
    g.debts = g.debts.filter(d => d.p !== i);
    ev(g, out, { t: 'elim', p: i, text });
    checkWin(g, out, true);
  }

  // ---------- nákupy ----------
  function canBuyState(g, i) {
    const p = P(g, i), s = nodeState(p.node);
    if (!s || !g.states[s] || g.states[s].owner >= 0) return null;
    if (p.node === FED) return null; // New York nelze koupit na políčku banky
    const price = D.states[s].price;
    return { state: s, price };
  }
  function buyState(g, out, i, s) {
    const p = P(g, i), price = D.states[s].price;
    if (p.cash < price) return false;
    p.cash -= price;
    g.states[s] = { owner: i, legal: false, label: null };
    ev(g, out, { t: 'buy', p: i, state: s, amt: price, text: price ? `${p.name} kupuje ${s} za ${fmt(price)}.` : `${p.name} získává ${s} zdarma.` });
    ev(g, out, { t: 'pay', from: i, to: -1, amt: price, why: 'Nákup státu ' + s, silent: true });
    return true;
  }

  function cardPriceFor(g, i, c) {
    const base = CARDS[c].price;
    const disc = shareholderPct(g, i);
    return Math.round(base * (100 - disc) / 100);
  }
  function shareholderPayouts(g, out, buyer, base) {
    SH.forEach(c => {
      const o = cardOwner(g, c);
      if (o >= 0 && o !== buyer && P(g, o).alive) pay(g, out, -1, o, base * CARDS[c].pct / 100, `Podíl ${CARDS[c].name} z prodeje karty`);
    });
  }
  // co může hráč s kartou udělat
  function cardActions(g, i, c) {
    const def = CARDS[c], cur = g.cards[c], p = P(g, i), res = [];
    if (!p.alive) return res;
    if (c === 'mafia') {
      if (!cur && p.node === FED && g.pending && g.pending.type === 'start' && g.pending.p === i)
        res.push({ act: 'rent', cost: cardPriceFor(g, i, c), label: 'Zapůjčit na jednu jízdu' });
      return res;
    }
    if (def.rent) {
      if (!cur) {
        res.push({ act: 'rent', cost: def.deposit, label: 'Zapůjčit (jistina)' });
        res.push({ act: 'buy', cost: cardPriceFor(g, i, c), label: 'Koupit' });
      } else if (cur.owner === i && cur.mode === 'rent') {
        res.push({ act: 'buyout', cost: Math.max(0, cardPriceFor(g, i, c) - cur.deposit), label: 'Dokoupit' });
        res.push({ act: 'return', cost: -cur.deposit, label: 'Vrátit (jistina zpět)' });
      } else if (cur.owner !== i && cur.mode === 'rent') {
        res.push({ act: 'outbid', cost: cur.deposit + 10000, label: 'Přeplatit jistinu' });
        res.push({ act: 'buy', cost: cardPriceFor(g, i, c), label: 'Koupit' });
      }
      return res;
    }
    if (!cur) {
      if (c === 'snb' && !ownedStates(g, i).some(s => s !== 'New York' && s !== 'California')) return res;
      res.push({ act: 'buy', cost: cardPriceFor(g, i, c), label: 'Koupit' });
    }
    return res;
  }
  function cardAct(g, i, c, act, extra) {
    const out = [], p = P(g, i), def = CARDS[c];
    const opt = cardActions(g, i, c).find(o => o.act === act);
    if (!opt) return { ok: false, out, err: 'Tuto akci teď nelze provést.' };
    if (opt.cost > 0 && p.cash < opt.cost) return { ok: false, out, err: 'Nemáte dost peněz.' };
    const cur = g.cards[c];
    if (act === 'buy') {
      if (cur && cur.mode === 'rent' && cur.owner !== i) pay(g, out, -1, cur.owner, cur.deposit, `Vrácená jistina ${def.name}`);
      p.cash -= opt.cost; p.paid[c] = opt.cost;
      g.cards[c] = { owner: i, mode: 'own' };
      shareholderPayouts(g, out, i, def.price);
      if (c === 'snb') g.snb = extra && extra.state || null;
      ev(g, out, { t: 'card', p: i, card: c, text: `${p.name} kupuje kartu ${def.name} za ${fmt(opt.cost)}.` });
    } else if (act === 'rent') {
      p.cash -= opt.cost;
      if (c === 'mafia') { g.cards[c] = { owner: i, mode: 'rent' }; shareholderPayouts(g, out, i, def.price); }
      else g.cards[c] = { owner: i, mode: 'rent', deposit: opt.cost };
      ev(g, out, { t: 'card', p: i, card: c, text: `${p.name} si zapůjčuje kartu ${def.name} (${fmt(opt.cost)}).` });
    } else if (act === 'outbid') {
      pay(g, out, -1, cur.owner, cur.deposit, `Vrácená jistina ${def.name}`);
      const prev = P(g, cur.owner).name;
      p.cash -= opt.cost;
      g.cards[c] = { owner: i, mode: 'rent', deposit: opt.cost };
      ev(g, out, { t: 'card', p: i, card: c, text: `${p.name} přeplatil hráče ${prev} a zapůjčuje si ${def.name} (${fmt(opt.cost)}).` });
    } else if (act === 'buyout') {
      p.cash -= opt.cost; p.paid[c] = opt.cost + cur.deposit;
      g.cards[c] = { owner: i, mode: 'own' };
      shareholderPayouts(g, out, i, def.price);
      ev(g, out, { t: 'card', p: i, card: c, text: `${p.name} dokupuje kartu ${def.name}.` });
    } else if (act === 'return') {
      p.cash += cur.deposit; delete g.cards[c];
      ev(g, out, { t: 'card', p: i, card: c, text: `${p.name} vrací kartu ${def.name} a dostává zpět jistinu ${fmt(-opt.cost)}.` });
    }
    return { ok: true, out };
  }
  function placeSNB(g, i, s) {
    if (!hasCard(g, i, 'snb') || g.states[s].owner !== i || s === 'New York' || s === 'California') return false;
    g.snb = s; return true;
  }

  // ---------- značky ----------
  function bankStates(g) { const b = ['New York', 'California']; if (g.snb) b.push(g.snb); return b; }
  function labelCheck(g, i, type, s) {
    const st = g.states[s], p = P(g, i);
    if (!st || st.owner !== i) return 'Stát vám nepatří.';
    if (st.label) return 'Stát už má značku.';
    if (g.labelsLeft[type] <= 0) return 'Všechny značky tohoto typu jsou rozebrané.';
    if (p.cash < LABELS[type].price) return 'Nemáte dost peněz.';
    const banks = bankStates(g);
    if (banks.includes(s)) return 'Značku nelze umístit do státu s bankou.';
    if (type === 'independent') {
      if (banks.some(b => (D.adj[b] || []).includes(s))) return 'Independent Label nelze dát do státu sousedícího s bankou.';
      // každý hráč musí mít stále cestu mezi bankami
      st.label = 'independent';
      const ok = g.players.every(q => !q.alive || q.id === i || hasCard(g, q.id, 'fedhw') || connected(g, q.id));
      st.label = null;
      if (!ok) return 'Značka by některému hráči znemožnila cestu do banky.';
    }
    return null;
  }
  function connected(g, i) {
    const seen = new Set([FED]), q = [FED];
    while (q.length) {
      const u = q.shift();
      if (u === BC) return true;
      ADJ[u].forEach(a => { if (!seen.has(a.v) && !blockedFor(g, i, a.v, u)) { seen.add(a.v); q.push(a.v); } });
    }
    return false;
  }
  function placeLabel(g, i, type, s) {
    const err = labelCheck(g, i, type, s);
    if (err) return { ok: false, err, out: [] };
    const out = [], p = P(g, i);
    p.cash -= LABELS[type].price; g.labelsLeft[type]--;
    g.states[s].label = type;
    ev(g, out, { t: 'label', p: i, state: s, label: type, text: `${p.name} umístil ${LABELS[type].name} na ${s}.` });
    return { ok: true, out };
  }

  // ---------- prodej bance ----------
  function sellables(g, i) {
    const res = [];
    ownedStates(g, i).forEach(s => {
      const lab = g.states[s].label;
      res.push({ kind: 'state', id: s, name: s + (lab ? ` + ${LABELS[lab].name}` : ''), value: D.states[s].price + (lab ? LABELS[lab].price : 0) });
    });
    Object.keys(g.cards).forEach(c => {
      const cd = g.cards[c];
      if (cd.owner !== i || c === 'mafia') return;
      if (cd.mode === 'rent') res.push({ kind: 'card', id: c, name: CARDS[c].name + ' (vrátit zápůjčku)', value: cd.deposit });
      else res.push({ kind: 'card', id: c, name: CARDS[c].name, value: P(g, i).paid[c] != null ? P(g, i).paid[c] : CARDS[c].price });
    });
    return res;
  }
  function sell(g, i, kind, id) {
    const out = [], p = P(g, i);
    const it = sellables(g, i).find(x => x.kind === kind && x.id === id);
    if (!it) return { ok: false, out };
    if (kind === 'state') {
      const lab = g.states[id].label; if (lab) g.labelsLeft[lab]++;
      g.states[id] = { owner: -1, legal: false, label: null };
      if (g.snb === id) g.snb = null;
    } else { delete g.cards[id]; if (id === 'snb') g.snb = null; }
    p.cash += it.value;
    ev(g, out, { t: 'sell', p: i, text: `${p.name} prodává bance: ${it.name} za ${fmt(it.value)}.` });
    settleDebts(g, out, i);
    return { ok: true, out };
  }
  function settleDebts(g, out, i) {
    const p = P(g, i);
    g.debts.filter(d => d.p === i).forEach(d => {
      const give = Math.min(p.cash, d.amt);
      if (give > 0) {
        p.cash -= give; d.amt -= give;
        if (d.to >= 0 && P(g, d.to).alive) P(g, d.to).cash += give;
        ev(g, out, { t: 'pay', from: i, to: d.to, amt: give, why: 'Splátka dluhu: ' + d.why });
      }
    });
    g.debts = g.debts.filter(d => d.amt > 0);
  }
  function debtOf(g, i) { return g.debts.filter(d => d.p === i).reduce((s, d) => s + d.amt, 0); }

  // ---------- obchod mezi hráči ----------
  // offer = {a, b, give:{states:[],cards:[],cash}, get:{...}}
  function tradeValid(g, t) {
    const chk = (i, side) => {
      const p = P(g, i);
      if (!p.alive) return false;
      if ((side.cash || 0) > p.cash) return false;
      if ((side.states || []).some(s => g.states[s].owner !== i)) return false;
      if ((side.cards || []).some(c => !g.cards[c] || g.cards[c].owner !== i || g.cards[c].mode !== 'own')) return false;
      return true;
    };
    return chk(t.a, t.give) && chk(t.b, t.get);
  }
  function doTrade(g, t) {
    const out = [];
    if (!tradeValid(g, t)) return { ok: false, out };
    const move = (from, to, side) => {
      (side.states || []).forEach(s => { g.states[s].owner = to; g.states[s].legal = false; if (g.snb === s && cardOwner(g, 'snb') !== to) g.snb = null; });
      (side.cards || []).forEach(c => { g.cards[c].owner = to; P(g, to).paid[c] = P(g, from).paid[c] != null ? P(g, from).paid[c] : CARDS[c].price; if (c === 'snb' && (!g.snb || g.states[g.snb].owner !== to)) g.snb = null; });
      if (side.cash) { P(g, from).cash -= side.cash; P(g, to).cash += side.cash; }
    };
    move(t.a, t.b, t.give); move(t.b, t.a, t.get);
    // SNB stojí ve státě, který už držiteli nepatří
    if (g.snb && g.states[g.snb].owner !== cardOwner(g, 'snb')) g.snb = null;
    ev(g, out, { t: 'trade', text: `Obchod: ${P(g, t.a).name} ⇄ ${P(g, t.b).name}.` });
    return { ok: true, out };
  }
  function assetValue(g, side) {
    return (side.cash || 0) + (side.states || []).reduce((s, x) => s + D.states[x].price + (g.states[x].label ? LABELS[g.states[x].label].price : 0) + (D.states[x].fed + D.states[x].bc) * 4, 0)
      + (side.cards || []).reduce((s, c) => s + CARDS[c].price, 0);
  }

  // ---------- průběh tahu ----------
  function nextPlayer(g) {
    const n = g.players.length;
    let j = g.cur;
    for (let k = 0; k < n; k++) { j = (j + 1) % n; if (P(g, j).alive) break; }
    if (j <= g.cur) g.turn++;
    g.cur = j;
  }
  function checkWin(g, out, onlyLast) {
    if (g.winner != null) return true;
    const al = alive(g);
    let w = null;
    if (al.length === 1) w = al[0].id;
    else if (!onlyLast) {
      if (g.opts.targetCash) { const c = al.find(p => p.cash >= g.opts.targetCash); if (c) w = c.id; }
      if (w == null && g.opts.targetStates) { const c = al.find(p => ownedStates(g, p.id).length >= g.opts.targetStates); if (c) w = c.id; }
    }
    if (w != null) { g.winner = w; g.pending = { type: 'over', winner: w }; ev(g, out, { t: 'win', p: w, text: `${P(g, w).name} vyhrává hru!` }); return true; }
    return false;
  }

  // po každém kroku: dluhy -> rozhodnutí
  function afterResolve(g, out) {
    const debtor = g.debts.find(d => P(g, d.p).alive);
    if (debtor) { g.pending = { type: 'debt', p: debtor.p, amt: debtOf(g, debtor.p), resume: g.pending }; return; }
  }

  function endTurn(g, out) {
    if (checkWin(g, out)) return;
    nextPlayer(g);
    const p = P(g, g.cur);
    g.move = null;
    g.pending = { type: 'start', p: g.cur };
    ev(g, out, { t: 'turn', p: g.cur });
    if (g.snb && !g.cards.snb) g.snb = null;
  }

  function roll(g, i, n) {
    const out = [], p = P(g, i);
    n = n || p.diceN || 2;
    if (!g.pending || g.pending.type !== 'start' || g.pending.p !== i) return { ok: false, out };
    const fee = DICE_FEE[n] || 0;
    if (fee && p.cash < fee) return { ok: false, out, err: 'Nemáte dost peněz na poplatek za kostky.' };
    if (fee) pay(g, out, i, -1, fee, `Poplatek za hod ${n} ${n === 1 ? 'kostkou' : 'kostkami'}`);
    g.move = { n, rolls: 0 };
    doRoll(g, out, i);
    return { ok: true, out };
  }
  function doRoll(g, out, i) {
    const p = P(g, i), n = g.move.n;
    const dice = Array.from({ length: n }, () => rnd(6));
    const dbl = n === 2 && dice[0] === dice[1];
    g.move.dice = dice; g.move.dbl = dbl; g.move.rolls++; g.lastRoll = { p: i, dice };
    g.move.left = dice.reduce((a, b) => a + b, 0);
    g.move.total = g.move.left;
    ev(g, out, { t: 'dice', p: i, dice, dbl, text: `${p.name} hází ${dice.join(' + ')} = ${g.move.left}${dbl ? ' (dvojice – hází znovu)' : ''}.` });
    if (p.circuit < 2 && !p.rerollUsed) { g.pending = { type: 'reroll', p: i, dice }; return; }
    continueMove(g, out, i);
  }
  function rerollChoice(g, i, again) {
    const out = [];
    if (!g.pending || g.pending.type !== 'reroll' || g.pending.p !== i) return { ok: false, out };
    if (again) {
      P(g, i).rerollUsed = true;
      g.move.rolls--;
      ev(g, out, { t: 'msg', text: `${P(g, i).name} využívá jednorázové přehození.` });
      const p = P(g, i), n = g.move.n;
      const dice = Array.from({ length: n }, () => rnd(6));
      const dbl = n === 2 && dice[0] === dice[1];
      g.move.dice = dice; g.move.dbl = dbl; g.move.rolls++; g.lastRoll = { p: i, dice };
      g.move.left = dice.reduce((a, b) => a + b, 0); g.move.total = g.move.left;
      ev(g, out, { t: 'dice', p: i, dice, dbl, text: `${p.name} hází znovu: ${dice.join(' + ')} = ${g.move.left}${dbl ? ' (dvojice)' : ''}.` });
    }
    continueMove(g, out, i);
    return { ok: true, out };
  }
  function continueMove(g, out, i) {
    const p = P(g, i);
    while (g.move.left > 0 && p.alive && g.winner == null) {
      const opts = moveOptions(g, i);
      if (opts.length > 1) { g.pending = { type: 'dir', p: i, options: opts, left: g.move.left }; afterResolve(g, out); return; }
      stepTo(g, out, i, opts[0]);

  }
  function chooseDir(g, i, to) {
    const out = [];
    if (!g.pending || g.pending.type !== 'dir' || g.pending.p !== i) return { ok: false, out };
    const opt = g.pending.options.find(o => o.to === to);

    return { ok: true, out };
  }
  function finishMove(g, out, i) {

  async function play(out) {

    }
    let moved = false;
    for (const e of out) {
      if (e.t === 'move') {
        if (trailPlayer !== e.p) { trailPlayer = e.p; lastTrail = [e.from]; }
        lastTrail.push(e.to);
        drawPawns(); drawTrail(); followNode(e.to); moved = true;
        await sleep(isHuman(e.p) ? 170 : 210);
      } else if (e.t === 'dice') {

      } else if (e.t === 'pay') {
        if (e.silent || !e.amt) { if (e.owed) toast(`${pname(e.from)} nemá na platbu, dluží ${fmt(e.owed)}.`, 'minus'); continue; }
        const txt = e.to < 0 ? `${pname(e.from)} platí ${fmt(e.amt)} · ${e.why}` : e.from < 0 ? `${pname(e.to)} +${fmt(e.amt)} · ${e.why}` : `${pname(e.from)} → ${pname(e.to)}: ${fmt(e.amt)} · ${e.why}`;
        toast(txt, e.from < 0 ? 'plus' : 'minus');
        if (e.owed) toast(`${pname(e.from)} nemá na platbu, dluží ${fmt(e.owed)}.`, 'minus');
        renderChips(); flyBills(e.from, e.to, e.amt);
        await sleep(300);
      } else if (e.t === 'bank') {
        if (e.items && e.items.length && isHuman(e.p)) await bankSheet(e);

  }

  const RULES_HTML = `
<h4>Cíl hry</h4><p>Kupujte státy a jezděte figurkou mezi bankami FED (New York) a BC (Sacramento). V bance inkasujete částky z karet vašich států. Vyhrává, kdo jako poslední nezbankrotuje (nebo kdo dosáhne cíle nastaveného na začátku).</p>
<h4>Tah</h4><ul><li>Házíte dvěma kostkami. Dvojice znamená hod navíc. Za poplatek můžete házet 1 kostkou (5 000 $), 3 kostkami (10 000 $) nebo 4 kostkami (20 000 $).</li><li>Na rozcestí vybíráte směr. Do banky dojedete vždy – zbytek hodu propadá.</li><li>Při prvním okruhu FED → BC → FED smíte jednou hod přehodit.</li></ul>
<h4>Mýtné</h4><ul><li>Každé překročení hranice cizího státu (vjezd i výjezd) stojí 1 000 $, každé zastavení v něm dalších 1 000 $.</li><li>Mýtné se platí až za státy legalizované průjezdem bankou FED.</li><li>Zastavení v bance se počítá jako zastavení ve státě: v bance FED se platí majiteli New Yorku, v bance BC majiteli Californie. Cesta do banky bez dalšího zastavení v tom státě tedy stojí nejméně 3 000 $ (vjezd, zastavení v bance, výjezd).</li><li>Double Label, Chief (×2) a Commander (×4) se násobí.</li></ul>
<h4>Placené trasy</h4><p>Zkratky (modré s hvězdou) a Kanadská dálnice se platí bance, a pokud někdo vlastní Californii, jemu. Lodní a letecké linky se platí bance, nebo majiteli karty Sea Lines / Air Lines. Majitel příslušné karty jezdí zdarma.</p>
<h4>Jak aplikace vykládá nejasná místa</h4><ul>
<li>Každé políčko (i s hvězdou, lodí, letadlem) je 1 krok. Letadla a lodě neleží v žádném státě – nepočítá se tam mýtné ani se nedá nic koupit.</li>
<li>Zákaz „vrátit se stejnou cestou": během jedné jízdy z banky nelze projet žádný úsek trasy dvakrát. Po příjezdu do banky začíná nová jízda a lze jet zpět stejnou trasou.</li>
<li>Na placenou trasu nelze vjet bez peněz na jízdenku, pokud existuje jiná cesta.</li>
<li>Dvojice platí jen při hodu dvěma kostkami.</li>
<li>V bankách se vyplácí za všechny vlastněné státy, i nelegalizované. Legalizace ovlivňuje jen mýtné.</li>
<li>Chief a Commander násobí mýtné a výplatu v BC, výplatu ve FED ne (podle textu na kartě „except FED").</li>
<li>Special Label: při zastavení se platí navíc hodnota celého hodu × 1 000 $ (s násobením Chief/Commander).</li>
<li>Shareholder: majitel má slevu na všechny speciální karty (sčítá se) a dostává od banky svůj podíl z ceny, kdykoli si speciální kartu koupí jiný hráč. Na Californii a značky se nevztahuje.</li>
<li>Mafia vyřadí hráče, se kterým se figurky potkají nebo projedou stejným políčkem – kdokoli z nich jede. Na políčkách bank se vyřazovat nedá. Jakmile zůstane jediný hráč, hra okamžitě končí.</li>
<li>Independent Label zakazuje vstup do státu i letadlem nebo lodí. Na leteckou či lodní linku, která vede jen do zakázaného státu, nelze nastoupit.</li>
<li>Second National Bank: hráč, který vjede do jejího státu, inkasuje od majitele 1 000 $ za každý svůj stát a začíná tam novou jízdu (nezastavuje).</li>
<li>Independent Label nelze umístit, pokud by kterémukoli hráči znemožnil cestu mezi FED a BC.</li>
<li>Nemá-li hráč na platbu, zaplatí, co má, a zbytek dluží. Dluh splatí prodejem majetku bance za nákupní cenu (zapůjčené karty vrátí za jistinu). Kdo nemůže, zbankrotuje a jeho majetek se vrací bance.</li>
<li>Karta California: majitel v Sacramentu nic neinkasuje a ostatním vyplácí jejich podíl, ve FED dostává 30 000 $.</li>
</ul>`;

      });
      if (setupPlayers.length < 7) card.append(h('button', { class: 'btn ghost', onclick: () => { setupPlayers.push({ name: 'Počítač ' + (setupPlayers.length + 1), ai: true, color: freeColor() }); draw(); } }, '+ Přidat hráče'));
      const vs = h('select', { id: 'victory', onchange: e => { victory = e.target.value; draw(); } },
        h('option', { value: 'last', selected: victory === 'last' }, 'Vyhrává poslední, kdo nezbankrotuje'),
        h('option', { value: 'cash', selected: victory === 'cash' }, 'Vyhrává, kdo první dosáhne hotovosti'),
        h('option', { value: 'states', selected: victory === 'states' }, 'Vyhrává, kdo první vlastní počet států'));
      card.append(h('label', { class: 'fl' }, 'Konec hry', vs));
      card.append(h('p', { class: 'note', style: 'margin:-4px 0 0' }, victory === 'last' ? 'Hra končí, jakmile zůstane jediný hráč – ať ostatní zbankrotují, nebo je vyřadí Mafia.' : 'Hra končí dosažením cíle, nebo dříve, pokud zůstane jediný hráč (ostatní zbankrotují nebo je vyřadí Mafia).'));
      if (victory === 'cash') card.append(h('label', { class: 'fl' }, 'Cílová hotovost ($)', h('input', { id: 'tcash', type: 'number', step: 50000, min: 100000, value: target, style: 'border:2px solid var(--paper-3);border-radius:8px;padding:9px;font:16px var(--f-body)', oninput: e => { target = +e.target.value || 1000000; } })));
      if (victory === 'states') card.append(h('label', { class: 'fl' }, 'Cílový počet států', h('input', { id: 'tstates', type: 'number', min: 3, max: 49, value: targetStates, style: 'border:2px solid var(--paper-3);border-radius:8px;padding:9px;font:16px var(--f-body)', oninput: e => { targetStates = +e.target.value || 15; } })));
      card.append(h('button', { class: 'btn red big', onclick: () => {
        const ps = setupPlayers.map((p, k) => ({ name: (p.name || '').trim() || (p.ai ? 'Počítač ' : 'Hráč ') + (k + 1), ai: p.ai, color: p.color }));
        clearSave();
        startGame(E.newGame(ps, { targetCash: victory === 'cash' ? target : 0, targetStates: victory === 'states' ? targetStates : 0 }));
      } }, 'Začít hru'));
      card.append(h('button', { class: 'btn soft', onclick: openRules }, 'Pravidla'));
    };
    draw();
    S.append(h('div', { class: 'hero-wrap' }, h('div', { class: 'hero', role: 'img', 'aria-label': 'Výřez herní desky s názvem hry' })), card);
  }
  function pickColor(p, done) {
    sheet(`Barva – ${p.name || 'hráč'}`, (b, close) => {
      b.append(h('p', { class: 'note', style: 'margin:0' }, 'Když vyberete barvu jiného hráče, barvy se prohodí.'));
      const grid = h('div', { class: 'colorgrid' });
      E.COLORS.forEach(c => {
        const other = setupPlayers.find(q => q !== p && q.color === c.id);
        grid.append(h('button', { class: 'colorpick', 'aria-pressed': String(p.color === c.id), onclick: () => { if (other) other.color = p.color; p.color = c.id; close(); done(); } },
          h('span', { html: starSVG(c.id, 44) }), h('b', null, c.name), h('small', null, other ? other.name : p.color === c.id ? 'vybráno' : 'volná')));
      });
      b.append(grid);
    });
  }
  function startGame(g) {
    G = g;
    $('#setup').hidden = true; $('#app').hidden = false;
    busy = false; lastTrail = []; trailPlayer = -1;
    requestAnimationFrame(() => {
      fitView(); buildOverlay();
      const n = pl(G.cur).node; view.s = Math.min(coverScale(), 0.4); view.tx = wrap.clientWidth / 2 - px(n) * view.s; view.ty = wrap.clientHeight / 2 - py(n) * view.s; clampView(); applyView();
      refresh();
    });
  }

  // ============ start ============
  function init() {
    wrap = $('#mapwrap'); world = $('#world'); overlay = $('#overlay');
    setupPanZoom();
    $('#zin').onclick = () => zoomAt(1.5, wrap.clientWidth / 2, wrap.clientHeight / 2);
    $('#zout').onclick = () => zoomAt(1 / 1.5, wrap.clientWidth / 2, wrap.clientHeight / 2);
    $('#zfit').onclick = () => fitView();
    $('#zme').onclick = () => { if (G) focusNodes([pl(G.pending && G.pending.p != null ? G.pending.p : G.cur).node], 0.35); };
    $('#menuBtn').onclick = openMenu;
    $('#chips').addEventListener('scroll', placeLastRoll, { passive: true });
    window.addEventListener('resize', () => setTimeout(placeLastRoll, 50));
    showSetup();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
